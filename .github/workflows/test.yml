name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Build attacker-controlled artifact
        run: |
          set -e
          mkdir -p /tmp/content
          echo 5 > /tmp/content/pr_number.txt
          echo "plain report" > /tmp/content/report.txt
          echo "marker target file" > /tmp/content/pwnINJECTED.txt
          echo payload > '/tmp/content/$(id).txt'
          python3 - <<'PY'
          name = "pwn$(echo INJECTED).txt"
          open("/tmp/content/" + name, "w").write("injected-name payload\n")
          PY
          ls -1 /tmp/content
      - uses: actions/upload-artifact@v4
        with:
          name: content
          path: /tmp/content
