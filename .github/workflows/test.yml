name: Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: build artifact with attacker-controlled filenames
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -e
          mkdir -p content
          printf 'plain report\n' > content/report.txt
          printf '%s\n' "$PR" > content/pr_number.txt
          printf 'payload\n' > 'content/p$(id > /tmp/comment).txt'
          ls -1 content
      - uses: actions/upload-artifact@v4
        with:
          name: content
          path: content/
