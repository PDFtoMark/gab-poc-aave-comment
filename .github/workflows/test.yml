name: Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: build artifact
        run: |
          set -e
          mkdir -p content
          printf 'plain report\n' > content/report.txt
          ls -1 content
      - uses: actions/upload-artifact@v4
        with:
          name: content
          path: content/
