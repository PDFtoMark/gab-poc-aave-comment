name: exprprobe

on:
  workflow_dispatch:

permissions:
  actions: read

jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        env:
          A: ${{ secrets.READ_ONLY_PAT || github.token }}
          B: ${{ github.token }}
        run: |
          echo "lenA=${#A}"
          echo "lenB=${#B}"
          echo "prefixB=${B:0:4}"
